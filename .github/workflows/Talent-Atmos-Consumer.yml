# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"

      - name: Build
        id: build
        run: |
          go build -v -o app ./cmd/main.go || exit 1

      - name: Check build result
        if: ${{ steps.build.outcome != 'success' }}
        run: echo "Build stage failed."
        id: build_failed

    outputs:
      outcome: ${{ steps.build.outcome }}

  container_build_push:
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ needs.build.outputs.outcome == 'success' }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
          TAG=latest
          COMMIT_HASH=${{ github.sha }}

          VERSION_TAG=$IMAGE_NAME:$COMMIT_HASH

          docker buildx create --use
          docker buildx build --push \
            --platform linux/amd64,linux/arm64 \
            --tag $IMAGE_NAME:$TAG \
            --tag $VERSION_TAG \
            --push .

          docker buildx imagetools create -t $IMAGE_NAME:amd64 --tag $IMAGE_NAME:$COMMIT_HASH-amd64 $IMAGE_NAME:$COMMIT_HASH
          docker buildx imagetools create -t $IMAGE_NAME:arm64 --tag $IMAGE_NAME:$COMMIT_HASH-arm64 $IMAGE_NAME:$COMMIT_HASH

      - name: Notify on Success
        if: ${{ steps.container_build_push.outcome == 'success' }}
        run: echo "Docker image successfully pushed to GitHub Container Registry"

  notify:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        run: |
          BUILD_STATUS="${{ needs.build.outputs.outcome }}"

          if [ "$BUILD_STATUS" != "success" ]; then
            STAGE="Build"
            STATUS="failure"
          else
            STAGE="All"
            STATUS="success"
          fi

          MESSAGE=$(cat <<EOF
          {
            "username": "GitHub Actions",
            "embeds": [{
              "title": "Workflow $STATUS - $STAGE Stage",
              "description": "Workflow: **${{ github.workflow }}**\\nActor: ${{ github.actor }}\nGithub-Commit-Head: ${{ github.sha }}\nBranch: **${{ github.ref_name }}**\\nRepository: **${{ github.repository }}**\\nCommit-msg: ${{ github.event.head_commit.message }}\nStatus: $STATUS\n[View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
              "color": $(if [ "$STATUS" == "success" ]; then echo "3066993"; else echo "15158332"; fi)
            }]
          }
          EOF
          )

          curl -X POST \
            -H "Content-Type: application/json" \
            -d "$MESSAGE" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
